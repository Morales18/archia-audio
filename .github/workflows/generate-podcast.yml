name: Generate ArchIA podcast

on:
  push:
    paths:
      - "requests/*.json"
      - "scripts/generate_audio.py"
      - "config/technical_terms.json"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      request:
        description: "Request JSON path"
        required: true
        default: "requests/B03.json"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select request
        id: request
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUEST="${{ inputs.request }}"
          else
            REQUEST="$(git show --pretty="" --name-only "${{ github.sha }}" | grep '^requests/.*\.json$' | tail -n 1 || true)"
            if [ -z "$REQUEST" ]; then
              REQUEST="$(find requests -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)"
            fi
          fi
          test -n "$REQUEST"
          test -f "$REQUEST"
          echo "path=$REQUEST" >> "$GITHUB_OUTPUT"
          echo "Using request: $REQUEST"

      - name: Show provider availability
        shell: bash
        run: |
          if [ -n "$AZURE_SPEECH_KEY" ] && [ -n "$AZURE_SPEECH_REGION" ]; then
            echo "Azure Speech credentials detected: Azure will be the primary provider."
          else
            echo "Azure Speech credentials not configured: Edge TTS fallback will be used."
          fi

      - name: Generate MP3
        run: python scripts/generate_audio.py "${{ steps.request.outputs.path }}"

      - name: Upload podcast artifact
        uses: actions/upload-artifact@v4
        with:
          name: archia-podcast-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
